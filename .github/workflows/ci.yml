name: CI

on:
  push:
    branches: [main]
  pull_request:
    # no branch filter: stacked PRs (base != main) must run CI too
  workflow_dispatch:
    # manual run; on main it also deploys the draft build to itch.io (deploy-itch-draft)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'auto' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_BIN: /home/runner/.local/share/godot/bin/godot
  WEB_SIZE_BUDGET_BYTES: 30000000 # NFR4, decimal bytes (Story 1.3 DC4)

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # cold stripped-template build; warm runs take minutes
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot binary and Web export templates
        id: godot-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/godot/bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-linux-web-v1

      - name: Install Godot ${{ env.GODOT_RELEASE }} and Web templates
        id: install
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
          for f in "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" "Godot_v${GODOT_RELEASE}_export_templates.tpz"; do
            curl -fsSL -o "$tmp/$f" "$base/$f"
            (cd "$tmp" && awk -v f="$f" '$2 == f || $2 == "*" f' SHA512-SUMS.txt | tee sum.line | grep -c . | grep -qx 1 && sha512sum -c sum.line)
          done
          mkdir -p ~/.local/share/godot/bin
          unzip -q -o "$tmp/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -d "$tmp/bin"
          mv "$tmp/bin/Godot_v${GODOT_RELEASE}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          # Only the Web templates are needed; the full .tpz is ~1.3 GB.
          unzip -q -o -j "$tmp/Godot_v${GODOT_RELEASE}_export_templates.tpz" 'templates/version.txt' 'templates/web_*' -d "$tpl"
          rm -rf "$tmp"

      - name: Save Godot cache (also when later steps fail)
        if: always() && steps.godot-cache.outputs.cache-hit != 'true' && steps.install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.local/share/godot/bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-linux-web-v1

      - name: Godot version
        run: |
          "$GODOT_BIN" --headless --version
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project (build class_name cache)
        run: |
          set -o pipefail
          mkdir -p build/ci
          "$GODOT_BIN" --headless --path game --import 2>&1 | tee build/ci/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' build/ci/import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Unit tests (GUT)
        run: |
          set -o pipefail
          mkdir -p build/ci
          status=0
          "$GODOT_BIN" --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee build/ci/gut.log || status=$?
          # Godot headless can exit 0 after a script fails to load, so the log is checked too.
          sed -E 's/\x1b\[[0-9;]*m//g' build/ci/gut.log > build/ci/gut.plain.log
          failed=0
          for marker in 'SCRIPT ERROR' 'Parse Error' 'Failed to load script' 'does not extend GutTest' '[Failed]' 'failing tests'; do
            if grep -nF -- "$marker" build/ci/gut.plain.log; then
              echo "::error::GUT log contains failure marker: $marker"
              failed=1
            fi
          done
          tests="$(sed -nE 's/^Tests +([0-9]+)$/\1/p' build/ci/gut.plain.log | tail -1)"
          if [ -z "$tests" ] || [ "$tests" -lt 1 ]; then
            echo "::error::GUT ran no tests (Tests=${tests:-missing})"
            failed=1
          fi
          if ! grep -qF -- '---- All tests passed! ----' build/ci/gut.plain.log; then
            echo "::error::GUT did not report 'All tests passed!' (failing, pending or risky tests also fail CI)"
            failed=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::GUT exited with code $status"
            failed=1
          fi
          exit "$failed"

      - name: Static guards
        run: bash game/tools/check_guards.sh

      - name: Cache stripped Web export template
        id: tpl-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/web-template
          key: web-template-${{ env.GODOT_RELEASE }}-${{ hashFiles('game/tools/build_web_template.sh') }}

      - name: Build stripped Web export template (cache miss only)
        id: tpl-build
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          start=$(date +%s)
          bash game/tools/build_web_template.sh "$RUNNER_TEMP/tplbuild"
          mkdir -p ~/.cache/web-template
          cp "$RUNNER_TEMP/tplbuild/godot/bin/godot.web.template_release.wasm32.nothreads.dlink.zip" ~/.cache/web-template/web_dlink_nothreads_release.zip
          echo "Template build took $(( $(date +%s) - start )) s"
          echo "### Stripped template cold build: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Save stripped template cache
        if: steps.tpl-cache.outputs.cache-hit != 'true' && steps.tpl-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/web-template
          key: web-template-${{ env.GODOT_RELEASE }}-${{ hashFiles('game/tools/build_web_template.sh') }}

      - name: Install stripped template over the stock Web release template
        run: |
          set -euo pipefail
          test -s ~/.cache/web-template/web_dlink_nothreads_release.zip
          cp ~/.cache/web-template/web_dlink_nothreads_release.zip ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_dlink_nothreads_release.zip
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_dlink_nothreads_release.zip

      - name: Web export
        run: |
          set -o pipefail
          mkdir -p build/web build/ci
          "$GODOT_BIN" --headless --path game --export-release "Web" ../build/web/index.html 2>&1 | tee build/ci/export.log
          for f in index.html index.pck index.wasm; do
            test -f "build/web/$f" || { echo "::error::build/web/$f missing"; exit 1; }
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: .*[Ee]xport' build/ci/export.log; then
            echo "::error::Errors in Web export log"
            exit 1
          fi
          ls -la build/web

      - name: Web build size (NFR4, fails over budget)
        run: |
          set -euo pipefail
          find build/web -type f -exec wc -c {} + | sort -n
          total="$(find build/web -type f -exec wc -c {} + | awk '$2 != "total" {s += $1} END {print s + 0}')"
          echo "Web build total: ${total} bytes (budget ${WEB_SIZE_BUDGET_BYTES})"
          echo "### Web build size: ${total} bytes (budget ${WEB_SIZE_BUDGET_BYTES})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -le 0 ]; then
            echo "::error::Web build is empty"
            exit 1
          fi
          if [ "$total" -gt "$WEB_SIZE_BUDGET_BYTES" ]; then
            echo "::error title=Web build over NFR4 budget::${total} bytes > ${WEB_SIZE_BUDGET_BYTES} bytes"
            exit 1
          fi

      - name: Upload Web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  deploy-itch-draft:
    # Manual only: Actions -> CI -> Run workflow on main. Never on push or pull_request (Story 1.3 DC2).
    needs: test-and-export
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The secret is scoped to the gate and push steps only; secrets.* cannot be used in a job-level if: (DC10).
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      BUTLER_VERSION: 15.32.0
      BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
    steps:
      - name: Gate on BUTLER_API_KEY and ITCH_TARGET
        id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          ITCH_TARGET="$(printf '%s' "${ITCH_TARGET}" | tr -d '[:space:]')"
          if [ -n "${ITCH_TARGET}" ] && ! printf '%s' "${ITCH_TARGET}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::ITCH_TARGET must be <user>/<game>, got a malformed value"
            exit 1
          fi
          if [ -z "${BUTLER_API_KEY}" ] || [ -z "${ITCH_TARGET}" ]; then
            echo "::notice title=itch.io deploy skipped::Set the BUTLER_API_KEY secret and the ITCH_TARGET variable (<user>/<game>) to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Web build
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Install butler ${{ env.BUTLER_VERSION }}
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/butler.zip" "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  $tmp/butler.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -q -o "$tmp/butler.zip" -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/butler"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$tmp"

      - name: butler version and push flags
        if: steps.gate.outputs.skip != 'true'
        run: |
          butler version
          butler push --help

      - name: Push to itch.io (${{ vars.ITCH_TARGET }}:html5)
        if: steps.gate.outputs.skip != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        # butler reads BUTLER_API_KEY from the environment; the key is never on a command line.
        run: |
          set -euo pipefail
          test -f build/web/index.html
          butler push build/web "${ITCH_TARGET}:html5" --userversion "${GITHUB_SHA}"
